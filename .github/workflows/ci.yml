name: Verify

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Grant Execute Permission for gradlew
        run: chmod +x gradlew

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Preflight (books / config / channels / scripts / driver)
        run: node testharness/tools/preflight.js

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew build
