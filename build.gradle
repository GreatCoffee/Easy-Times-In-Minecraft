/**
 * It is advised that you do not edit anything in the build.gradle; unless you are sure of what you are doing
 */
import com.gtnewhorizons.retrofuturagradle.mcp.InjectTagsTask
import net.darkhax.curseforgegradle.TaskPublishCurseForge
import org.jetbrains.changelog.Changelog
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
    id 'net.darkhax.curseforgegradle' version '1.3.33' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'org.jetbrains.changelog' version '2.5.0'
    id 'com.gradleup.shadow' version '9.6.+'
}

apply from: 'gradle/scripts/helpers.gradle'

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'

assertSubProperties 'use_tags', 'tag_class_name'
assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'use_mixins', 'mixin_booter_version', 'mixin_refmap'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'
assertSubProperties 'use_asset_mover', 'asset_mover_version'

setDefaultProperty 'use_modern_java_syntax', false, false
setDefaultProperty 'use_jetbrains_annotations', false, false
setDefaultProperty 'generate_sources_jar', true, false
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'mapping_channel', true, 'stable'
setDefaultProperty 'mapping_version', true, '39'
setDefaultProperty 'use_dependency_at_files', true, true
setDefaultProperty 'minecraft_username', true, 'Developer'
setDefaultProperty 'extra_jvm_args', false, ''
setDefaultProperty 'extra_tweak_classes', false, ''
setDefaultProperty 'change_minecraft_sources', false, false
setDefaultProperty 'publish_to_curseforge', true, false
setDefaultProperty 'mixin_connector_class', false, ''

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName.set(propertyString('mod_id'))
}

tasks.decompressDecompiledSources.enabled !propertyBool('change_minecraft_sources') || !layout.buildDirectory.dir('rfg/minecraft-src').get().asFile.exists()

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(propertyBool('use_modern_java_syntax') ? 16 : 8))
        // Azul covers the most platforms for Java 8 toolchains, crucially including MacOS arm64
        vendor.set(JvmVendorSpec.AZUL)
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

configurations {
    mixinAgent {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
}

minecraft {
    mcVersion.set('1.12.2')

    mcpMappingChannel.set(propertyString('mapping_channel'))
    mcpMappingVersion.set(propertyString('mapping_version'))

    useDependencyAccessTransformers.set(propertyBool('use_dependency_at_files'))

    username.set(propertyString('minecraft_username'))
    
    // Add any additional tweaker classes here
    extraTweakClasses.addAll(propertyStringList('extra_tweak_classes'))

    // Add various JVM arguments here for runtime
    def args = ['-ea:' + group]
    if (propertyBool('use_mixins')) {
        args << '-Dmixin.checks.interfaces=true'
        args << '-Dmixin.debug.export=true'
    }
    extraRunJvmArguments.addAll(args)
    extraRunJvmArguments.addAll(propertyStringList('extra_jvm_args'))

    if (propertyBool('use_tags')) {
        if (file('tags.properties').exists()) {
            Properties props = new Properties().tap { it.load(file('tags.properties').newInputStream()); it }
            if (!props.isEmpty()) {
                injectedTags.set(props.collectEntries { k, v ->
                        def interpolated = interpolate(v)
                        if (interpolated == null || interpolated.isEmpty()) throw new GradleException("Empty tag value found for key: $k")
                        [(k): interpolated]
                })
            }
        }
    }
}

repositories {
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
}

dependencies {
    if (propertyBool('use_modern_java_syntax')) {
        annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        // Workaround for https://github.com/bsideup/jabel/issues/174
        annotationProcessor 'net.java.dev.jna:jna-platform:5.13.0'
        compileOnly ('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false
        }
        // Allow jdk.unsupported classes like sun.misc.Unsafe, workaround for JDK-8206937 and fixes crashes in tests
        patchedMinecraft 'me.eigenraven.java8unsupported:java-8-unsupported-shim:1.0.0'
        // Include for tests
        testAnnotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        testCompileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false // We only care about the 1 annotation class
        }
    }
    if (propertyBool('use_jetbrains_annotations')) {
        compileOnly 'org.jetbrains:annotations:26.1.0'
    }
    if (propertyBool('use_asset_mover')) {
        implementation "com.cleanroommc:assetmover:${propertyString('asset_mover_version')}"
    }
    if (propertyBool('use_mixins')) {
        String mixin = modUtils.enableMixins("zone.rong:mixinbooter:${propertyString('mixin_booter_version')}", propertyString('mixin_refmap'))
        implementation (mixin) {
            transitive = false
        }
        annotationProcessor mixin
        add ('mixinAgent', mixin) {
            transitive = false
        }
    }
    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

if (propertyBool('use_mixins')) {
    ['runClient', 'runServer', 'runObfClient', 'runObfServer'].each { taskName ->
        tasks.named(taskName, JavaExec).configure { JavaExec task ->
            task.doFirst {
                if (task.debug) {
                    task.jvmArgs("-javaagent:${configurations.mixinAgent.singleFile.absolutePath}")
                }
            }
        }
    }
}

// Adds Access Transformer files to tasks
if (propertyBool('use_access_transformer')) {
    def atFiles = propertyStringList('access_transformer_locations').collect { location ->
        def fileLocation = file("src/main/resources/${location}")
        if (!fileLocation.exists()) {
            throw new GradleException("Access Transformer file [$fileLocation] does not exist!")
        }
        return fileLocation
    }

    // Apply ATs to both Minecraft and Forge sources/runtime patched jar
    tasks.named('applyJST').configure {
        accessTransformerFiles.from(atFiles)
    }
}

processResources {

    filteringCharset = 'UTF-8'

    inputs.property 'mod_id', propertyString('mod_id')
    inputs.property 'mod_name', propertyString('mod_name')
    inputs.property 'mod_version', propertyString('mod_version')
    inputs.property 'mod_description', propertyString('mod_description')
    inputs.property 'mod_authors', "${propertyStringList('mod_authors', ',').join(', ')}"
    inputs.property 'mod_credits', propertyString('mod_credits')
    inputs.property 'mod_url', propertyString('mod_url')
    inputs.property 'mod_update_json', propertyString('mod_update_json')
    inputs.property 'mod_logo_path', propertyString('mod_logo_path')
    inputs.property 'mixin_refmap', propertyString('mixin_refmap')
    inputs.property 'mixin_package', propertyString('mixin_package')
    inputs.property 'mixin_configs', propertyStringList('mixin_configs').join(' ')

    def filterList = ['mcmod.info', 'pack.mcmeta']
    filterList.addAll(propertyStringList('mixin_configs'))

    filesMatching(filterList) { fcd ->
        fcd.expand(
                'mod_id': propertyString('mod_id'),
                'mod_name': propertyString('mod_name'),
                'mod_version': propertyString('mod_version'),
                'mod_description': propertyString('mod_description'),
                'mod_authors': "${propertyStringList('mod_authors', ',').join(', ')}",
                'mod_credits': propertyString('mod_credits'),
                'mod_url': propertyString('mod_url'),
                'mod_update_json': propertyString('mod_update_json'),
                'mod_logo_path': propertyString('mod_logo_path'),
                'mixin_refmap': propertyString('mixin_refmap'),
                'mixin_package': propertyString('mixin_package')
        )
    }
    
    if (propertyBool('use_access_transformer')) {
        rename '(.+_at.cfg)', 'META-INF/$1'
    }

}

jar {
    manifest {
        def attribute_map = [:]
        if (propertyBool('is_coremod')) {
            attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
            if (propertyBool('coremod_includes_mod')) {
                attribute_map['FMLCorePluginContainsFMLMod'] = true
                def currentTasks = gradle.startParameter.taskNames
                if (currentTasks[0] == 'build' || currentTasks[0] == 'prepareObfModsFolder' || currentTasks[0] == 'runObfClient') {
                    attribute_map['ForceLoadAsMod'] = true
                }
            }
        }
        if (propertyBool('use_access_transformer')) {
            attribute_map['FMLAT'] = propertyString('access_transformer_locations')
        }
        def mixinConfigs = propertyStringList('mixin_configs')
        if (!mixinConfigs.isEmpty()) {
            attribute_map['MixinConfigs'] = mixinConfigs.join(',')
        }
        def mixinConnectorClass = propertyString('mixin_connector_class')
        if (!mixinConnectorClass.isEmpty()) {
            attribute_map['MixinConnector'] = mixinConnectorClass
        }
        attributes(attribute_map)
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "0. Setup Decomp Workspace"(Gradle) {
                    taskNames = ["setupDecompWorkspace"]
                }
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Run Obfuscated Client"(Gradle) {
                    taskNames = ["runObfClient"]
                }
                "4. Run Obfuscated Server"(Gradle) {
                    taskNames = ["runObfServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                            (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = 8
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
            changelog.get(propertyString('mod_version')).withHeader(false).withEmptySections(false),
            Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

tasks.register('generateMixinJson') {
    group 'cleanroom helpers'
    def missingConfig = propertyStringList('mixin_configs').findAll(config -> !file("src/main/resources/${config}").exists())
    onlyIf {
        if (propertyBool('use_mixins') && propertyBool('generate_mixins_json')) {
            return !missingConfig.empty
        }
        return false
    }
    doLast {
        for (String mixinConfig : missingConfig) {
            def file = file("src/main/resources/${mixinConfig}")
            file << """{\n\t"package": "",\n\t"required": true,\n\t"refmap": "${propertyString('mixin_refmap')}",\n\t"target": "@env(DEFAULT)",\n\t"minVersion": "0.8.5",\n\t"compatibilityLevel": "JAVA_8",\n\t"mixins": [],\n\t"server": [],\n\t"client": []\n}"""
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (propertyBool('use_modern_java_syntax')) {
        if (it.name in ['compileMcLauncherJava', 'compilePatchedMcJava']) {
            return
        }
        sourceCompatibility = 17
        options.release.set(8)
        javaCompiler.set(javaToolchains.compilerFor {
            languageVersion.set(JavaLanguageVersion.of(16))
            vendor.set(JvmVendorSpec.AZUL)
        })
    }
}

tasks.register('cleanroomAfterSync') {
    group 'cleanroom helpers'
    dependsOn 'injectTags', 'generateMixinJson'
}

if (propertyBool('use_modern_java_syntax')) {
    tasks.withType(Javadoc).configureEach {
        sourceCompatibility = 17
    }
}

tasks.named('injectTags', InjectTagsTask).configure {
    onlyIf {
        return propertyBool('use_tags') && !it.getTags().get().isEmpty()
    }
    it.outputClassName.set(propertyString('tag_class_name'))
}

tasks.named('prepareObfModsFolder').configure {
    finalizedBy 'prioritizeCoremods'
    finalizedBy 'restoreCompatMods'
}

tasks.register('prioritizeCoremods') {
    dependsOn 'prepareObfModsFolder'
    doLast {
        fileTree('run/obfuscated').forEach {
            if (it.isFile() && it.name =~ '^(mixinbooter|configanytime)(-)([0-9])+\\.+([0-9])+(.jar)') {
                it.renameTo(new File(it.parentFile, "!${it.name}"))
            }
        }
    }
}

// prepareObfModsFolder (RFG 2.0.3) wipes run/obfuscated/mods on every run
// (doFirst deleteQuietly on all entries) and repopulates only its own
// framework set — the user's compatibility mods (兼容.md master list kept
// in run/mods, feeding the obf chain; dev runClient rounds hold it via
// etimDevClientModsHold below) would be lost every launch. Restore them
// right after the wipe: copy everything from run/mods except this mod's
// dev jar and the framework jars the obf folder already provisions itself.
tasks.register('restoreCompatMods') {
    doLast {
        def srcDir = file('run/mods')
        def obfDir = file('run/obfuscated/mods')
        if (!srcDir.isDirectory()) {
            return
        }
        // normalized matches: strip the FML load-order '!' prefix before comparing —
        // run26 10:59-round FAIL: a bare 'mixinbooter-11.13.jar' slipped past the
        // '!mixinbooter' skip and duplicated the coremod (FATAL DuplicateModsFound).
        def skipStems = ['etim-1.0.0-dev', 'mixinbooter-11.13', 'mixinextras-common-0.5.5',
                         'osxnarratorblocker-1.0', 'strip-latest-forge-requirements-1.0',
                         'cleanmix-0.7.1', 'gson-2.8.0', 'guava-21.0']
        def stem = { name -> name.replaceFirst('^!+', '').replaceFirst('\\.jar$', '') }
        srcDir.listFiles().findAll {
            it.isFile() && it.name.endsWith('.jar') && !skipStems.contains(stem(it.name))
        }.each { f ->
            copy {
                from f
                into obfDir
            }
        }
    }
}

// ETIM test harness: after restoreCompatMods repopulates the obf mods
// folder, a runObfServer round must NOT carry the client-only/coremod
// jars (OptiFine/SmoothFont/rebind coremods and client-only mods crash
// a dedicated server). Hook a hinge task after the restore that stashes
// them into testharness/mods-hold — only when the launched task is
// runObfServer (client rounds keep the full compatibility set).
tasks.register('etimTestServerModsHold') {
    onlyIf { gradle.startParameter.taskNames.any { it == 'runObfServer' } }
    doLast {
        def holdDir = file('testharness/mods-hold')
        def obfDir = file('run/obfuscated/mods')
        holdDir.mkdirs()
        ['OptiFine_1.12.2_HD_U_G5.jar', 'SmoothFont-mc1.12.2-2.1.4.jar',
         'rebind-1.12.2-2.7.5-0.jar', 'journeymap-forge-1.12.2-6.0.10.jar',
         'rad-1.12-1.1.0.jar', 'StepUp-1.0.2-mc1.10-1.12.jar',
         'MouseTweaks-2.10.1-mc1.12.2.jar', 'jecharacters-1.12.0-3.7.3.jar',
         'osxnarratorblocker-1.0.jar', 'fencejumper-1.12-1.0.5.jar',
         // the project's own release-style jar double-loads on the server
         // (classpath container + mods copy = the same file scanned twice):
         // runObfServer loads etim from the classpath alone.
         'etim-1.0.0.jar'].each { n ->
            def f = new File(obfDir, n)
            if (f.exists()) {
                f.renameTo(new File(holdDir, n))
            }
        }
        println '[etim-harness] server mods hold complete'
    }
}
tasks.named('restoreCompatMods') { finalizedBy 'etimTestServerModsHold' }

// ============ ETIM compat hard gate (user ruling 2026-10-20) ============
// The 兼容.md list is a HARD requirement, not optional: on every client
// round the compatibility mods load alongside etim; a missing entry fails
// the launch loudly (listing what is absent) — never silently dropped, and
// never held as a group (supersedes 580525a's hold-all dev chain). Per-mod
// exemption requires a crash-log citation; the only four are the deobf-dev
// crashers held by etimDevClientModsGate below (evidence table:
// testharness/client/README.md). etimTestServerModsHold keeps holding the
// client-only jars out of runObfServer rounds — a dedicated server crashes
// on them (cited there), and server rounds are not client-test rounds.
def etimCompatList = [
        'CraftingTweaks_1.12.2-8.1.9.jar',
        'fencejumper-1.12-1.0.5.jar',
        'inventorysorter-1.12.2-1.13.3+57.jar',
        'jecharacters-1.12.0-3.7.3.jar',
        'jei_1.12.2-4.22.0.1034.jar',
        'journeymap-forge-1.12.2-6.0.10.jar',
        'MouseTweaks-2.10.1-mc1.12.2.jar',
        'OptiFine_1.12.2_HD_U_G5.jar',
        'rad-1.12-1.1.0.jar',
        'rebind-1.12.2-2.7.5-0.jar',
        'SmoothFont-mc1.12.2-2.1.4.jar',
        'StepUp-1.0.2-mc1.10-1.12.jar',
        'theoneprobe-1.12-1.4.28.jar'
]
// per-mod dev-runtime exemptions, each with its crash citation (README):
def etimDevCrashExempt = [
        'OptiFine_1.12.2_HD_U_G5.jar',      // GlStateManager.getBlendState VerifyError (ASM GET_BLEND_STATE)
        'SmoothFont-mc1.12.2-2.1.4.jar',    // same VerifyError
        'rebind-1.12.2-2.7.5-0.jar',        // NoSuchMethodError KeyBinding.func_151469_h()I
        'MouseTweaks-2.10.1-mc1.12.2.jar'   // NoClassDefFoundError 'bib' (obf class name)
]
def jarNames = { File dir ->
    (dir.isDirectory() ? dir.listFiles() : []).findAll { it.isFile() && it.name.endsWith('.jar') }*.name
}
def etimCompatMissing = { List<String> presentNames ->
    etimCompatList.findAll { n -> !presentNames.contains(n) }
}

// dev runClient: gate the FULL list first, then hold ONLY the four
// crash-exempt jars out for this round — the remaining 9 load alongside
// etim. Restored on exit by etimDevClientModsRestore (finalizedBy also
// fires on a crash exit; manual recovery after a hard kill:
// `gradlew etimDevClientModsRestore`).
tasks.register('etimDevClientModsGate') {
    onlyIf { gradle.startParameter.taskNames.any { it == 'runClient' } }
    doLast {
        def modsDir = file('run/mods')
        def missing = etimCompatMissing(jarNames(modsDir))
        if (!missing.isEmpty()) {
            throw new GradleException('[etim-harness] COMPAT GATE FAIL (dev runClient) — the 兼容.md list is a hard gate, these compat mod(s) are missing from run/mods: ' + missing)
        }
        def holdDir = file('run/mods-hold-dev')
        holdDir.mkdirs()
        def held = jarNames(modsDir).findAll { etimDevCrashExempt.contains(it) }
        held.each { n -> new File(modsDir, n).renameTo(new File(holdDir, n)) }
        println '[etim-harness] dev compat gate OK: ' + (etimCompatList.size() - held.size()) + ' compat mod(s) load alongside etim; ' + held.size() + ' crash-exempt held per-mod: ' + held
    }
}
tasks.register('etimDevClientModsRestore') {
    doLast {
        def holdDir = file('run/mods-hold-dev')
        if (!holdDir.isDirectory()) {
            return
        }
        def modsDir = file('run/mods')
        def restored = holdDir.listFiles().findAll { it.isFile() }
        restored.each { f -> f.renameTo(new File(modsDir, f.name)) }
        println "[etim-harness] dev client mods restore complete (${restored.size()} jar(s) restored)"
    }
}
tasks.named('runClient').configure {
    dependsOn 'etimDevClientModsGate'
    finalizedBy 'etimDevClientModsRestore'
}

// obf client (the default client-test chain): the full list must be
// present. Ordering note: the testharness obfclient-fix.init.gradle doFirst
// (added during gradle INIT, before this script configures) runs first and
// syncs the etim jar — this gate only checks the compat list itself.
tasks.named('runObfClient').configure {
    doFirst {
        def missing = etimCompatMissing(jarNames(file('run/obfuscated/mods')))
        if (!missing.isEmpty()) {
            throw new GradleException('[etim-harness] COMPAT GATE FAIL (obf client) — the 兼容.md list is a hard gate, these compat mod(s) are missing from run/obfuscated/mods: ' + missing)
        }
        println "[etim-harness] obf compat gate OK: all ${etimCompatList.size()} compat mod(s) present alongside etim"
    }
}

// manual audit entry point (no onlyIf): prints the missing list for both
// faces; throws if either face is incomplete
tasks.register('etimCompatGateCheck') {
    doLast {
        def devMissing = etimCompatMissing(jarNames(file('run/mods')))
        def obfMissing = etimCompatMissing(jarNames(file('run/obfuscated/mods')))
        println '[etim-harness] compat gate check — dev run/mods missing: ' + (devMissing.isEmpty() ? 'none' : devMissing) + ' | obf run/obfuscated/mods missing: ' + (obfMissing.isEmpty() ? 'none' : obfMissing)
        if (!devMissing.isEmpty() || !obfMissing.isEmpty()) {
            throw new GradleException('[etim-harness] COMPAT GATE FAIL — see missing list above')
        }
    }
}

// ETIM test harness: dump the runObfServer javaexec launch line (runner-driven
// server execu; invoke via `gradlew etimDumpServerExec`)
tasks.register('etimDumpServerExec') {
    doLast {
        def je = tasks.named('runObfServer').get() as org.gradle.api.tasks.JavaExec
        try { println '[etim-harness] mainClass=' + je.mainClass.get() } catch (Throwable t) { println '[etim-harness] mainClass=? ' + t.message }
        try { println '[etim-harness] classpath=' + je.classpath.asPath } catch (Throwable t) { println '[etim-harness] classpath=?' }
        try { println '[etim-harness] jvmArgs=' + je.jvmArgs } catch (Throwable t) {}
        try { println '[etim-harness] args=' + je.args } catch (Throwable t) {}
        try { println '[etim-harness] allJvmArgs=' + je.allJvmArgs } catch (Throwable t) {}
    }
}

idea.project.settings {
    taskTriggers {
        afterSync 'cleanroomAfterSync'
    }
}

if (propertyBool('publish_to_curseforge')) {
    assertProperty 'curseforge_project_id'
    apply plugin: 'net.darkhax.curseforgegradle'
    tasks.register('curseforge', TaskPublishCurseForge) {
        group 'publishing'
        description "Uploads CurseForge project ${propertyString('curseforge_project_id')}"
    }
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
